name: Barrios (OpenStreetMap)

# Los barrios para elegir en Ajustes → Avisos. Cambian poco: una vez por mes, o a mano.
on:
  schedule:
    - cron: '17 9 1 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  barrios:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PIEDRAZON_DATOS: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      # El código de los scripts está en un repo privado; se baja a codigo/ con un token de solo lectura
      - uses: actions/checkout@v4
        with:
          repository: diegoesteve/piedrazon-codigo
          token: ${{ secrets.CODIGO_TOKEN }}
          path: codigo
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: codigo/requirements.txt
      - run: pip install -r codigo/requirements.txt
      - name: Barrios de OpenStreetMap
        run: python codigo/scripts/barrios.py
      - name: Guardar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/barrios.json
          git diff --cached --quiet && exit 0
          git commit -m "barrios: $(TZ=America/Argentina/Cordoba date '+%d/%m %H:%M')"
          git pull --rebase -X theirs && git push
