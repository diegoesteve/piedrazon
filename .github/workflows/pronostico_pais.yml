name: Pronóstico de todo el país (en prueba)

# Aparte del de Córdoba, para que nunca lo frene: dos veces por día (después de las corridas de las 06 y 18 UTC), con
# celdas de 0,2° y 3 días, para no pasar el límite diario de Open-Meteo. Escribe en data/pais/ y docs/data/pais/.
on:
  schedule:
    - cron: '50 7,19 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pronostico-pais
  cancel-in-progress: false

jobs:
  pronostico-pais:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      PIEDRAZON_DATOS: ${{ github.workspace }}
      PIEDRAZON_AMBITO: pais
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: diegoesteve/piedrazon-codigo
          token: ${{ secrets.CODIGO_TOKEN }}
          path: codigo
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: codigo/requirements.txt
      - run: pip install -r codigo/requirements.txt
      - name: Localidades de todo el país (si faltan)
        if: ${{ hashFiles('data/pais/localidades.json') == '' }}
        run: python codigo/scripts/localidades.py
      - name: Condiciones para granizo en todo el país
        env:
          PRONOSTICO_MAX_MIN: '40'
        run: python codigo/scripts/pronostico_granizo.py
      - name: Partir los datos del país por provincia (los que usa la app)
        if: always()
        run: python codigo/scripts/dividir_pais.py
      - name: Guardar
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/pais docs/data/prov docs/data/provincias.json data/pais
          git diff --cached --quiet && exit 0
          git commit -m "pronóstico del país: $(TZ=America/Argentina/Cordoba date '+%d/%m %H:%M')"
          git pull --rebase -X theirs && git push
