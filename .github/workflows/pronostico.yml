name: Pronóstico (días con condiciones para granizo)

on:
  schedule:
    - cron: '35 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pronostico
  cancel-in-progress: false

jobs:
  pronostico:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PIEDRAZON_DATOS: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      # El código de los scripts está en un repo privado; se baja a codigo/ con un token de solo lectura
      - uses: actions/checkout@v4
        with:
          repository: diegoesteve/piedrazon-codigo
          token: ${{ secrets.CODIGO_TOKEN }}
          path: codigo
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: codigo/requirements.txt
      - run: pip install -r codigo/requirements.txt
      - name: Localidades (si faltan)
        if: ${{ hashFiles('data/localidades.json') == '' }}
        run: python codigo/scripts/localidades.py
      - name: Condiciones para granizo por localidad
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          HISTORIAL_ARCHIVO: historial_alarmas_pronostico.csv
        run: python codigo/scripts/pronostico_granizo.py
      - name: Guardar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data data/*.json data/*.csv
          git diff --cached --quiet && exit 0
          git commit -m "pronóstico: $(TZ=America/Argentina/Cordoba date '+%d/%m %H:%M')"
          git pull --rebase -X theirs && git push
