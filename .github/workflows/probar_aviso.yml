name: Probar aviso al celular

on:
  workflow_dispatch:
    inputs:
      localidad:
        description: 'Localidad, escrita igual que en la app (con tildes)'
        required: true
        default: 'Córdoba'

jobs:
  probar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          repository: diegoesteve/piedrazon-codigo
          token: ${{ secrets.CODIGO_TOKEN }}
          path: codigo
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: codigo/requirements.txt
      - run: pip install -r codigo/requirements.txt
      - name: Mandar el aviso de prueba
        env:
          PUSH_URL: ${{ secrets.PUSH_URL }}
          PUSH_SECRETO: ${{ secrets.PUSH_SECRETO }}
          VAPID_PRIVADA: ${{ secrets.VAPID_PRIVADA }}
          PRUEBA_LOCALIDAD: ${{ inputs.localidad }}
          PIEDRAZON_DATOS: ${{ github.workspace }}
        run: python codigo/scripts/notificar.py
