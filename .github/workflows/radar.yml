name: Radar (granizo ahora)

on:
  schedule:
    - cron: '7,22,37,52 * * * *'   # fuera de los minutos más cargados de GitHub (:00, :15…)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PIEDRAZON_DATOS: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      # El código de los scripts está en un repo privado; se baja a codigo/ con un token de solo lectura
      - uses: actions/checkout@v4
        with:
          repository: diegoesteve/piedrazon-codigo
          token: ${{ secrets.CODIGO_TOKEN }}
          path: codigo
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: codigo/requirements.txt
      - run: pip install -r codigo/requirements.txt
      - name: Localidades (si faltan)
        if: ${{ hashFiles('data/localidades.json') == '' }}
        run: python codigo/scripts/localidades.py
      - name: Núcleos de tormenta de los radares del OHMC
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python codigo/scripts/radar_granizo.py
      - name: Alertas oficiales del SMN
        continue-on-error: true
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python codigo/scripts/smn_alertas.py
      - name: Avisos al celular
        continue-on-error: true
        env:
          PUSH_URL: ${{ secrets.PUSH_URL }}
          PUSH_SECRETO: ${{ secrets.PUSH_SECRETO }}
          VAPID_PRIVADA: ${{ secrets.VAPID_PRIVADA }}
        run: python codigo/scripts/notificar.py
      - name: Avisos al celular de la app de crecidas (predinun)
        continue-on-error: true
        env:
          PUSH_URL: ${{ secrets.PUSH_URL }}
          PUSH_SECRETO: ${{ secrets.PUSH_SECRETO }}
          VAPID_PRIVADA: ${{ secrets.VAPID_PRIVADA }}
        run: python codigo/scripts/notificar_crecidas.py
      # ---- resto del país (en prueba): escribe en data/pais/ y docs/data/pais/ (y por provincia en docs/data/prov/); si falla, no frena lo de Córdoba
      - name: Localidades de todo el país (si faltan)
        if: ${{ hashFiles('data/pais/localidades.json') == '' }}
        continue-on-error: true
        env:
          PIEDRAZON_AMBITO: pais
        run: python codigo/scripts/localidades.py
      - name: Radares de todo el país
        continue-on-error: true
        env:
          PIEDRAZON_AMBITO: pais
        run: python codigo/scripts/radar_granizo.py
      - name: Alertas del SMN de todo el país
        continue-on-error: true
        env:
          PIEDRAZON_AMBITO: pais
        run: python codigo/scripts/smn_alertas.py
      - name: Partir los datos del país por provincia (los que usa la app)
        continue-on-error: true
        run: python codigo/scripts/dividir_pais.py
      - name: Avisos al celular del resto del país
        continue-on-error: true
        env:
          PIEDRAZON_AMBITO: pais
          PUSH_URL: ${{ secrets.PUSH_URL }}
          PUSH_SECRETO: ${{ secrets.PUSH_SECRETO }}
          VAPID_PRIVADA: ${{ secrets.VAPID_PRIVADA }}
        run: python codigo/scripts/notificar.py
      - name: Guardar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data data/*.json data/*.csv data/pais
          git diff --cached --quiet && exit 0
          git commit -m "radar: $(TZ=America/Argentina/Cordoba date '+%d/%m %H:%M')"
          git pull --rebase -X theirs && git push
